- type: entity
  id: Memorial
  parent: BaseStructure
  name: memorial
  description: Commemorating something.
  components:
  - type: Sprite
    sprite: Structures/Furniture/Memorials/generic_memorial.rsi
    state: memorial
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.20"
        density: 85
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: InteractionOutline

# At 7:30 AM on March 8th, 2017, ArcLumin, a SS13 contributor, died in a fatal car crash on impact.
# Rest in peace, man. You did good work.
# When a contributor for SS13 dies, all codebases feel it and suffer.
# We may disagree on whether farts should be a thing, or what color to paint the bikeshed,
# but we are all contributors together.
# Goodbye, man. We'll miss you.
# This memorial has been designed for him and any future coders to perish.
- type: entity
  id: SS13Memorial
  parent: BaseStructure
  name: tomb of the unknown employee
  description: |
    Here rests an unknown employee
    Unknown by name or rank
    Whose acts will not be forgotten
  components:
    - type: Sprite
      sprite: Structures/Furniture/Memorials/ss13_memorial.rsi
      state: memorial
      drawdepth: Mobs
      noRot: true
      offset: "0.0,0.5"

- type: entity
  parent: Memorial
  id: Monolith
  name: monolith
  description: |
    Holy shit modern art.
    I bet it's worth a fortune.
  components:
  - type: Sprite
    color: "#1a1a22" #yes, I bothered to get the actual color from 2001 a space odyssey
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.20"
        density: 1500 # good luck.
        mask:
        - MachineMask # had to change em because youre intended to drag this back for mulah.
        layer:
        - MachineLayer
  - type: Anchorable
  - type: StaticPrice
    price: 25000
  - type: Prayable
    sentMessage: prayer-popup-notify-monolith-sent
    notificationPrefix: prayer-chat-notify-monolith
    verb: prayer-verbs-worship

# Possibly turn this into a functional display of nukie wins/losses like it actually is on Goonstation? Not right now though.
- type: entity
  abstract: true
  parent: Memorial
  id: BaseMemorialSyndicate
  name: mission memorial
  description: |
    This monument stands as a testament to the unwavering spirit of the Syndicate.
    It lists their losses and victories against enemies, and heroes of war forged from them.
    The structure is made of polished granite.
  components:
  - type: Sprite
    sprite: Structures/Furniture/Memorials/syndicate_memorial.rsi
    offset: "0,0.25" # Sprite is 32x64 so let's make the base actually be on the tile.
    noRot: true
    drawdepth: Overdoors
  - type: Transform
    noRot: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.3,0.35,0.3" # slightly shorter than wide
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: SpriteFade

- type: entity
  parent: BaseMemorialSyndicate
  id: MemorialSyndicateLeft
  suffix: Syndicate, Left
  components:
  - type: Sprite
    state: memorial_left

- type: entity
  parent: BaseMemorialSyndicate
  id: MemorialSyndicateMid
  suffix: Syndicate, Middle
  components:
  - type: Sprite
    state: memorial_mid

- type: entity
  parent: BaseMemorialSyndicate
  id: MemorialSyndicateRight
  suffix: Syndicate, Right
  components:
  - type: Sprite
    state: memorial_right
