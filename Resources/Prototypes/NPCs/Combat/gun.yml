# Tries to shoot a target at range.
- type: htnCompound
  id: GunCombatCompound
  branches:
    # Pick target, then move into range and shoot them.
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGunTargets

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            stopOnLineOfSight: true
            rangeKey: MeleeRange

        - !type:HTNPrimitiveTask
          operator: !type:JukeOperator
            jukeType: AdjacentTile

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:GunOperator
            targetKey: Target
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target

# Looks for ammo in inventory.
- type: htnCompound
  id: GetAmmoCompound
  branches:
    # Find ammo, switch hands, and THEN pick it up. It's necessary to query InventoryAmmo with the gun we want to use in the active hand.
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: InventoryAmmo
            key: TargetAmmo

        - !type:HTNPrimitiveTask
          operator: !type:SwapToFreeHandOperator

        - !type:HTNPrimitiveTask
          operator: !type:EquipOperator
            target: TargetAmmo

# TODO: Prioritise ammo for weapon we have equipped, otherwise grab anything if we don't have any.
# TODO: Only works on ballistic

# Selects a gun in range, then moves to it and picks it up.
- type: htnCompound
  id: PickupGunCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGuns
            key: Gun

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
        # This will actually take guns out of people's hands, out of closed lockers, etc., if it's in range and the NPC was already trying to pick up the gun.
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:ActiveHandFreePrecondition
            - !type:TargetInRangePrecondition
              targetKey: Gun
              rangeKey: InteractRange
          operator: !type:EquipOperator
            target: Gun

# Tries to look for a gun in inventory and take it, otherwise if no gun is found in inventory, tries to move to and pick up a gun from somewhere nearby on the ground (via PickupGunCompound).
# I'm not sure if ClearActiveHandCompound should go after InventoryGuns, but it seems to make sense that way although other parts of the code do the opposite.
- type: htnCompound
  id: GetGunCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: InventoryGuns
            key: Gun

        #- !type:HTNCompoundTask
        #  task: ClearActiveHandCompound

        - !type:HTNPrimitiveTask
          operator: !type:EquipOperator
            target: Gun

    # Couldn't find a gun in inventory, so alternatively acquire one from somewhere nearby on the ground
    - tasks:
        - !type:HTNCompoundTask
          task: PickupGunCompound

# TODO: Need a thing to recharge a laser gun
# TODO: When selecting pickup guns also add chargers or easy container grabs.

# Shorted version of RangedCombatCompound for entities that are guns themselves.
- type: htnCompound
  id: InnateRangedCombatCompound
  branches:
    - preconditions:
        - !type:GunAmmoPrecondition
          minPercent: 0.001
      tasks:
        - !type:HTNCompoundTask
          task: GunCombatCompound


- type: htnCompound
  id: RangedCombatCompound
  branches:
    # Move to target and shoot them if ammo
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
        - !type:GunAmmoPrecondition
          minPercent: 0.001
      tasks:
        - !type:HTNCompoundTask
          task: GunCombatCompound

    # If we don't have a gun or ammo in our hand: Take a gun from inventory, otherwise if we don't have one there, pick up a gun (with most ammo available) from somewhere on the ground nearby
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
          invert: true
        - !type:ActiveHandComponentPrecondition
          components:
            - type: BallisticAmmoProvider
          invert: true
      tasks:
        - !type:HTNCompoundTask
          task: GetGunCompound


      # Reload gun:
      # Try to find ammo first looking in bag, (which isnt very performant but if otherwise, you could cheese it by using ammo as bait) and then (TODO:, !!!!) look nearby too. Continue if we can't find any
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
        - !type:GunAmmoPrecondition
          maxPercent: 0.001
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: InventoryAmmo
            key: TargetAmmo

        - !type:HTNPrimitiveTask
          operator: !type:SwapToFreeHandOperator

        - !type:HTNPrimitiveTask
          operator: !type:GunEjectAmmoOperator
            targetKey: Gun

        # we don't need range check for equipping because we're only taking ammo from our inventory, so who cares
        - !type:HTNPrimitiveTask
          operator: !type:EquipOperator
            target: TargetAmmo

        - !type:HTNPrimitiveTask
          operator: !type:InteractWithOperator
            targetKey: Gun

        # It's jank but, basically just put the gun back into our active hand (since we can't swap without alot of jank)
        - !type:HTNPrimitiveTask
          operator: !type:EquipOperator
            target: Gun

    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
        - !type:GunAmmoPrecondition
          maxPercent: 0.001
        # Throw the gun away who cares
      tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:ActiveHandEntityPrecondition
          operator: !type:DropOperator
